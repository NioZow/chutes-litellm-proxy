model_list:
  - model_name: "anthropic/*"
    litellm_params:
      model: "anthropic/*"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "openai/*"
    litellm_params:
      model: "openai/*"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: "gemini/*"
    litellm_params:
      model: "gemini/*"
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: "perplexity/*"
    litellm_params:
      model: "perplexity/*"
      api_key: "os.environ/PERPLEXITY_API_KEY"

  - model_name: "xai/*"
    litellm_params:
      model: "xai/*"
      api_key: "os.environ/XAI_API_KEY"

  - model_name: "deepseek/*"
    litellm_params:
      model: "deepseek/*"
      api_key: "os.environ/DEEPSEEK_API_KEY"

  - model_name: "meta/*"
    litellm_params:
      model: "meta/*"
      api_key: "os.environ/META_API_KEY"

  - model_name: "chutes/*"
    litellm_params:
      model: "chutes/*"
      api_key: "os.environ/CHUTES_API_KEY"

general_settings:
  # no authentication required
  master_key: null
