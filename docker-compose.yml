services:
  litellm:
    build: .
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-data:/app/data
    environment:
      - LITELLM_OUTPUT=/app/data/config.generated.yml
      # Only providers whose key is set are expanded into the generated config;
      # unset ones are skipped. Add more *_API_KEY values as needed.
      - CHUTES_API_KEY=${CHUTES_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - META_API_KEY=${META_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - NEAR_API_KEY=${NEAR_API_KEY:-}
      # NEAR AI tuning (optional); verification is always enforced.
      - NEARAI_STREAM_MODE=${NEARAI_STREAM_MODE:-verified}
      - NEARAI_PREWARM_MODELS=${NEARAI_PREWARM_MODELS:-}
      - NEARAI_TEE_MODELS=${NEARAI_TEE_MODELS:-}
      # Optional pin file. Mount it into the container and set this to the
      # container-side path; a path that is not mounted fails closed.
      - NEARAI_MEASUREMENTS_FILE=${NEARAI_MEASUREMENTS_FILE:-}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./openwebui-data:/app/backend/data
